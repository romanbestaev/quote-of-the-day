<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цитата дня</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .quote-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 400;
            font-style: italic;
            line-height: 1.6;
            color: #2c3e50;
            margin-bottom: 40px;
            position: relative;
        }

        .quote-text::before,
        .quote-text::after {
            content: '"';
            font-size: clamp(3rem, 6vw, 5rem);
            color: #3498db;
            opacity: 0.3;
            position: absolute;
        }

        .quote-text::before {
            top: -40px;
            left: -30px;
        }

        .quote-text::after {
            bottom: -60px;
            right: -30px;
        }

        .quote-author {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 500;
            color: #7f8c8d;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .quote-author::before {
            content: '— ';
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .quote-card {
                padding: 40px 25px;
            }

            .quote-text::before {
                top: -30px;
                left: -20px;
            }

            .quote-text::after {
                bottom: -50px;
                right: -20px;
            }
        }

        @media (max-width: 480px) {
            .quote-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quote-card">
            <p class="quote-text">
                Единственный способ делать великие дела — любить то, что вы делаете.
            </p>
            <p class="quote-author">
                Стив Джобс
            </p>
        </div>
    </div>
</body>
</html>
